name: Metrics Dashboard
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Step 1: Isometric Commit Calendar (Full Year 3D)
      - name: Isometric Commit Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Matheus-Allvz
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Step 2: Repositories Traffic, Languages & Lines of Code
      - name: Repositories Traffic & Languages
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/traffic.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Matheus-Allvz
          template: classic
          base: repositories
          config_timezone: America/Sao_Paulo
          plugin_traffic: yes
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_lines: yes
