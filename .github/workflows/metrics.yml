name: Metrics Dashboard
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Isometric Commit Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Matheus-Allvz
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Coding Habits & Activity
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Matheus-Allvz
          template: classic
          base: header, activity
          config_timezone: America/Sao_Paulo
          plugin_habits: yes
          plugin_habits_from: 100
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

      - name: Achievements & Badges
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Matheus-Allvz
          template: classic
          base: header
          config_timezone: America/Sao_Paulo
          plugin_achievements: yes
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
          plugin_achievements_ignored: octo-planner, member
