name: Sync Actuar Enterprise Contributions
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Actuar Activity Sync
        env:
          ACTUAR_TOKEN: ${{ secrets.ACTUAR_TOKEN }}
        run: |
          python scripts/sync_actuar_activity.py
          git push origin main || echo "No new sync commits to push"
